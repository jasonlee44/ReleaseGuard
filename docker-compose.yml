services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: releaseguard
      POSTGRES_DB: releaseguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseguard -d releaseguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  fake-router:
    build: ./fake-router
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  releaseguard:
    build: ./releaseguard
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://releaseguard:releaseguard@db:5432/releaseguard
      FAKE_ROUTER_URL: http://fake-router:8001
    depends_on:
      db:
        condition: service_healthy
      fake-router:
        condition: service_healthy

volumes:
  pgdata: